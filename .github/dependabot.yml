version: 2
updates:
  # Enable version updates for npm dependencies
  - package-ecosystem: "npm"
    # `directories` (plural) rather than `directory`, because this is a Bun workspace
    # monorepo where every publishable package carries its own manifest. With only "/",
    # Dependabot's view of the workspace packages went stale: alerts were filed in
    # 2026-05 and 2026-07 against packages/qti2-to-pie and packages/transform-app,
    # manifests deleted in 2026-01 and 2026-03 respectively, while the dependencies
    # they named had simply moved into the renamed packages and stayed vulnerable.
    #
    # Only `directories` supports globbing, and the two keys are mutually exclusive.
    directories:
      - "/"
      - "/packages/*"
      - "/apps/*"
      - "/tools/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # Group dev dependencies together
      dev-dependencies:
        patterns:
          - "@types/*"
          - "@biomejs/*"
          - "@changesets/*"
          - "typescript"
          - "turbo"
        update-types:
          - "minor"
          - "patch"
      # Group testing dependencies
      test-dependencies:
        patterns:
          - "@playwright/*"
          - "playwright"
          - "vitest"
          - "@testing-library/*"
        update-types:
          - "minor"
          - "patch"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
