version: 2
updates:
  # Enable version updates for JavaScript dependencies.
  #
  # `bun`, not `npm`. This repo installs with Bun and its only lockfile is the root
  # bun.lock, which the npm ecosystem cannot write. Every PR Dependabot raised under
  # `npm` therefore changed a package.json without touching bun.lock, and CI failed at
  # the first step of every job with "lockfile had changes, but lockfile is frozen"
  # (jobs run `bun install --frozen-lockfile`). That is why no Dependabot JavaScript PR
  # in this repo has ever been mergeable. Dependabot supports Bun >= 1.1.39 as its own
  # ecosystem, which does maintain bun.lock.
  #
  # Kept at directory "/" deliberately. Bun workspaces resolve every member through the
  # single root lockfile, so the root entry covers all of packages/*, apps/* and
  # tools/*. Fanning `directories` out across the workspace globs instead produced one
  # PR per package per dependency — ~60 at once, including the same TypeScript bump
  # filed separately for 20 packages — without improving coverage.
  #
  # Note this does not affect Dependabot *alerts*: those come from the repository
  # dependency graph, which is built independently of this file.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # Group dev dependencies together
      dev-dependencies:
        patterns:
          - "@types/*"
          - "@biomejs/*"
          - "@changesets/*"
          - "typescript"
          - "turbo"
        update-types:
          - "minor"
          - "patch"
      # Group testing dependencies
      test-dependencies:
        patterns:
          - "@playwright/*"
          - "playwright"
          - "vitest"
          - "@testing-library/*"
        update-types:
          - "minor"
          - "patch"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
