version: 1

component:
  interactionType: positionObjectInteraction
  tagName: pie-qti-position-object

examplesApp:
  app: "@pie-qti/app-demo"
  routeTemplate: "/item-demo/{sampleId}"

evals:
  - id: position-object/position-object/correct-within-tolerance
    sampleId: position-object
    gradeBand: "K-12"
    subject: general
    intent: "Place the star on Austin and verify areaMapping tolerance scoring via mapResponsePoint."

    notes:
      - "positionObjectInteraction uses baseType='point' with cardinality='multiple'"
      - "Response format is an array of coordinate pairs like ['105 132']"
      - "areaMapping accepts any point within a 25px radius of the target, so exact pixels do not matter"

    steps:
      - action: navigate
        path: "/item-demo/position-object"

      - action: dragToCanvas
        target:
          description: "Drag the star marker onto Austin, Texas"
          hint: "Single draggable object; maxChoices is 1"
        # Within the 25px areaMapping radius of the declared correctResponse.
        value: ["110 140"]

      - action: submit
        target:
          description: "Submit Answer(s) button"
          hint: "Button text contains 'Submit Answer'"

    expected:
      responses:
        RESPONSE:
          lengthGte: 1
      outcomes:
        SCORE:
          equals: 1.0
        # No MAXSCORE in sample item

    spiritChecks:
      - "The draggable star is clearly visible as an icon, not just a text label."
      - "The star snaps onto the map and can be repositioned by dragging it again."
      - "Usage count ('0/1 used') updates once the star is placed."
      - "The remove button on a placed star restores it to the palette."
